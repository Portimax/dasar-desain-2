<div class="container">
<div class="card" id="start">

<p><b>Kelas X DKV</b></p>
<p class="small">Setiap peserta memperoleh 30 soal.</p>
<label>Nama</label><input id="name" placeholder="Nama lengkap">
<label>Kelas</label><input id="class" placeholder="Contoh: X DKV 1">
<label>Kode Ujian</label><input id="code" placeholder="Kode dari guru">
<button class="primary" onclick="startExam()">Mulai Ulangan</button>
<p id="startMsg" class="small"></p>
</div>

<div class="card hidden" id="exam">
<div class="top"><b id="student"></b><span class="timer" id="timer">30:00</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<h3 id="number"></h3>
<p id="question"></p>
<div id="options"></div>
<div class="top">
<button class="secondary" onclick="prev()">Sebelumnya</button>
<button class="primary" onclick="next()">Berikutnya</button>
</div>
</div>

<div class="card hidden" id="result">
<h1>Ulangan Selesai</h1>
<p id="resultStudent"></p>
<div class="score" id="score"></div>
<p id="resultDetail" style="text-align:center"></p>
<p class="small">Terimakasih sudah mengerjakan dengan baik.</p>
<button class="primary" onclick="location.reload()">Selesai</button>

      "Lisensi tersebut memiliki batasan terkait penggunaan komersial dan karya turunan",
      "CC selalu berarti bebas untuk semua penggunaan",
      "Aset tersebut hanya tidak boleh dicetak",
      "Atribusi membuat semua batasan hilang"
    ],
    "c": 0
  },
  {
    "q": "Seorang siswa membuat desain dengan menggunakan karya orang lain sesuai lisensi. Ia kemudian menyimpan catatan sumber, atribusi, dan bukti izin. Kebiasaan tersebut paling mencerminkan...",
    "a": [
      "Sikap profesional dalam pengelolaan kekayaan intelektual",
      "Usaha menghindari kreativitas",
      "Ketergantungan pada karya orang lain",
      "Ketidakmampuan membuat desain"
    ],
    "c": 0
  }
];
const TOTAL = 30;
const EXAM_MINUTES = 30;
let exam=[], answers=[], current=0, remaining=EXAM_MINUTES*60, timerId=null;
let studentName="", studentClass="", studentCode="";

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed+=0x6D2B79F5;let t=seed; t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){for(let i=arr.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function startExam(){
 studentName=document.getElementById('name').value.trim();
 studentClass=document.getElementById('class').value.trim();
 studentCode=document.getElementById('code').value.trim();
 const code=document.getElementById('code').value.trim();
 if(!studentName||!studentClass||!code){document.getElementById('startMsg').textContent='Lengkapi nama, kelas, dan kode ujian.';return}
 const seed=hash(studentName+'|'+studentClass+'|'+code);
 const r=rng(seed);
 let pool=[...Array(BANK.length).keys()];
 shuffle(pool,r);
 exam=pool.slice(0,TOTAL).map(i=>{
   const item=BANK[i];
   let opts=item.a.map((text,j)=>({text,correct:j===item.c}));
   shuffle(opts,r);
   return {q:item.q,opts};
 });
 answers=new Array(TOTAL).fill(null);
 document.getElementById('start').classList.add('hidden');
 document.getElementById('exam').classList.remove('hidden');
 document.getElementById('student').textContent=studentName+' — '+studentClass+' — '+studentCode;
 render();
 timerId=setInterval(()=>{remaining--;updateTimer();if(remaining<=0)finish()},1000);
}

function updateTimer(){
 let m=Math.floor(remaining/60),s=remaining%60;
 document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function render(){
 const item=exam[current];
 document.getElementById('number').textContent='Soal '+(current+1)+' dari '+TOTAL;
 document.getElementById('question').textContent=item.q;
 document.getElementById('bar').style.width=((current+1)/TOTAL*100)+'%';
 const box=document.getElementById('options');box.innerHTML='';
 item.opts.forEach((o,i)=>{
   const label=document.createElement('label');label.className='option';
   label.innerHTML='<input type="radio" name="ans" value="'+i+'"> '+String.fromCharCode(65+i)+'. '+escapeHtml(o.text);
   if(answers[current]===i) label.querySelector('input').checked=true;
   label.querySelector('input').addEventListener('change',e=>answers[current]=Number(e.target.value));
   box.appendChild(label);
 });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function next(){save();if(current<TOTAL-1){current++;render()}else{if(confirm('Akhiri ulangan sekarang?'))finish()}}
function prev(){save();if(current>0){current--;render()}}
function save(){const x=document.querySelector('input[name="ans"]:checked');if(x)answers[current]=Number(x.value)}
function finish(){
 save();clearInterval(timerId);
 let correct=0;answers.forEach((v,i)=>{if(v!==null&&exam[i].opts[v].correct)correct++});
 const score=Math.round(correct/TOTAL*100);
 document.getElementById('exam').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 document.getElementById('resultStudent').textContent=studentName+' — '+studentClass+' — '+studentCode;
 document.getElementById('score').textContent=score;
 document.getElementById('resultDetail').textContent='Benar: '+correct+' dari '+TOTAL+' soal';
}
</script>
</body>
</html>
